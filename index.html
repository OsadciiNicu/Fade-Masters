<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FADE MASTERS</title>
    
    <!-- Fonturi Google pentru Montserrat și Libre Baskerville -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome pentru iconițe -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            letter-spacing: -0.025em;
        }

        section {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            position: relative;
        }

        /* Navigație - cu Montserrat */
        .navigation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: -0.025em;
            padding: 30px 0;
            z-index: 1000;
            background-color: rgba(10, 10, 10, 0.9);
            transition: all 0.3s ease;
        }
        
        .nav-links {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 150px;
        }

        .nav-links li a {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: 600; 
            letter-spacing: 1.5px;
            text-transform: none;
            padding: 10px 0;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: -0.02em;
            transition: all 0.3s ease;
        }

        .nav-links li a:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        /* Icon coș de cumpărături */
        .cart-icon {
            position: fixed;
            top: 30px;
            right: 30px;
            background-color: #d4af37;
            color: #0a0a0a;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
            transition: all 0.3s ease;
        }

        .cart-icon:hover {
            background-color: #f1c84e;
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Modal coș de cumpărături */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            height: 100vh;
            background-color: #111;
            z-index: 1002;
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #d4af37;
        }

        .close-cart {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .cart-items {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #d4af37;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            background: #333;
            border: none;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
        }

        .remove-item {
            background: #ff4444;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        .cart-total {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
            padding-top: 20px;
            border-top: 2px solid #d4af37;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background-color: #d4af37;
            color: #0a0a0a;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            background-color: #f1c84e;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1001;
        }

        /* Restul stilurilor rămân la fel până la footer */
        /* ... (toate celelalte stiluri rămân neschimbate) ... */

        /* Hero Section */
        #hero {
            background-image: url('FM LP background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            text-align: center;
            position: relative;
        }

        #hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-line-1 {
            font-size: 75px;
            font-weight: 700;
            letter-spacing: 3px;
            font-family: 'Libre Baskerville', serif;
            line-height: 1;
            margin-bottom: 0;
        }

        .title-line-2 {
            font-size: 75px;
            font-weight: 700;
            letter-spacing: 3px;
            font-family: 'Libre Baskerville', serif;
            line-height: 1;
            margin-top: 0;
        }

        .subtitle {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.9;
            font-family: 'Montserrat', sans-serif;
            max-width: 500px;
            line-height: 1.5;
            margin-top: 25px;
        }

        .cta-button {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 40px;
            background-color: #d4af37;
            color: #0a0a0a;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-button:hover {
            background-color: #f1c84e;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Secțiune Despre Noi */
        #despre-noi {
            background-color: #111;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 80px;
            padding: 100px 50px;
        }

        .despre-content {
            max-width: 600px;
        }

        .section-title {
            font-family: 'Libre Baskerville', serif;
            font-size: 48px;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #d4af37;
        }

        .despre-text {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .despre-image {
            width: 400px;
            height: 500px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background-image: url('https://images.unsplash.com/photo-1567894340315-735d7c361db0?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDEwfHx8ZW58MHx8fHx8');
            background-size: cover;
            background-position: center;
        }

        /* Secțiune Servicii */
        #servicii {
            background-color: #0a0a0a;
            text-align: center;
        }

        .servicii-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
            max-width: 1200px;
        }

        .serviciu-card {
            background-color: #111;
            border-radius: 10px;
            padding: 40px 30px;
            width: 350px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .serviciu-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .serviciu-icon {
            font-size: 50px;
            color: #d4af37;
            margin-bottom: 25px;
        }

        .serviciu-title {
            font-family: 'Libre Baskerville', serif;
            font-size: 24px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .serviciu-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #d4af37;
        }

        .serviciu-desc {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .serviciu-pret {
            font-size: 22px;
            font-weight: 600;
            color: #d4af37;
        }

        /* Secțiune Shop */
        #shop {
            background-color: #111;
            text-align: center;
        }

        .produse-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
            max-width: 1200px;
        }

        .produs-card {
            background-color: #0a0a0a;
            border-radius: 10px;
            overflow: hidden;
            width: 280px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .produs-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .produs-image {
            height: 250px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #d4af37;
        }

        .produs-info {
            padding: 25px;
        }

        .produs-title {
            font-family: 'Libre Baskerville', serif;
            font-size: 20px;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .produs-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #d4af37;
        }

        .produs-desc {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #aaa;
        }

        .produs-pret {
            font-size: 20px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .produs-button {
            display: inline-block;
            padding: 10px 25px;
            background-color: #d4af37;
            color: #0a0a0a;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .produs-button:hover {
            background-color: #f1c84e;
        }

        /* Secțiune Programare */
        #programare {
            background-color: #0a0a0a;
            text-align: center;
        }

        .programare-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #111;
            padding: 60px;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .programare-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .form-group label {
            margin-bottom: 10px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 15px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-button {
            padding: 15px 40px;
            background-color: #d4af37;
            color: #0a0a0a;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-button:hover {
            background-color: #f1c84e;
            transform: translateY(-3px);
        }

        /* Footer */
        footer {
            background-color: #111;
            padding: 60px 20px 30px;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .footer-logo {
            font-family: 'Libre Baskerville', serif;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .footer-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 40px;
        }

        .footer-column {
            text-align: left;
            max-width: 300px;
        }

        .footer-column h3 {
            font-family: 'Libre Baskerville', serif;
            font-size: 20px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .footer-column h3::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #d4af37;
        }

        .footer-column p, .footer-column a {
            color: #aaa;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-column a:hover {
            color: #d4af37;
        }

        .social-icons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .social-icons a {
            color: white;
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #d4af37;
        }

        .copyright {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #777;
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .nav-links {
                gap: 100px;
            }
        }

        @media (max-width: 992px) {
            .nav-links {
                gap: 60px;
            }
            
            .nav-links li a {
                font-size: 20px;
            }
            
            #despre-noi {
                flex-direction: column;
                text-align: center;
            }
            
            .despre-content {
                max-width: 100%;
            }
            
            .section-title::after {
                left: 50%;
                transform: translateX(-50%);
                width: 80%;
            }

            .cart-modal {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                gap: 30px;
            }
            
            .nav-links li a {
                font-size: 18px;
            }
            
            .title-line-1, .title-line-2 {
                font-size: 50px;
            }
            
            .section-title {
                font-size: 36px;
            }
            
            .programare-container {
                padding: 40px 20px;
            }

            .cart-icon {
                top: 20px;
                right: 20px;
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 576px) {
            .nav-links {
                flex-direction: column;
                gap: 15px;
            }
            
            .navigation {
                padding: 20px 0;
            }
            
            .title-line-1, .title-line-2 {
                font-size: 40px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .footer-info {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .footer-column h3::after {
                left: 50%;
                transform: translateX(-50%);
                width: 80%;
            }
        }
  
   </style>
</head>
<body>
    <!-- Icon coș de cumpărături -->
    <div class="cart-icon" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count">0</span>
    </div>

    <!-- Modal coș de cumpărături -->
    <div class="overlay" onclick="closeCart()"></div>
    <div class="cart-modal">
        <div class="cart-header">
            <h2>Coșul tău</h2>
            <button class="close-cart" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-items">
            <!-- Items will be added here dynamically -->
        </div>
        <div class="cart-total">
            Total: <span class="total-amount">0</span> Lei
        </div>
        <button class="checkout-btn" onclick="checkout()">Finalizează comanda</button>
    </div>

    <!-- Navigație -->
    <nav class="navigation">
        <ul class="nav-links">
            <!-- Populat din content.json -->
        </ul>
    </nav>

    <!-- Hero Section -->
    <section id="hero">
        <div class="hero-content">
            <div class="title-container">
                <div class="title-line-1"></div>
                <div class="title-line-2"></div>
            </div>
            <p class="subtitle"></p>
            <a href="#" class="cta-button"></a>
        </div>
    </section>

    <!-- Secțiune Despre Noi -->
    <section id="despre-noi">
        <div class="despre-content">
            <h2 class="section-title"></h2>
            <div class="despre-text-container"></div>
            <a href="#" class="cta-button"></a>
        </div>
        <div class="despre-image">
            <!-- Imaginea Unsplash a fost adăugată ca background-image în CSS -->
        </div>
    </section>

    <!-- Secțiune Servicii -->
    <section id="servicii">
        <h2 class="section-title"></h2>
        <div class="servicii-container">
            <!-- Populat din content.json -->
        </div>
    </section>

    <!-- Secțiune Shop -->
    <section id="shop">
        <h2 class="section-title"></h2>
        <div class="produse-container">
            <!-- Populat din content.json -->
        </div>
    </section>

    <!-- Secțiune Programare -->
    <section id="programare">
        <h2 class="section-title"></h2>
        <div class="programare-container">
            <p class="subtitle"></p>
            
            <form class="programare-form">
                <div class="form-group">
                    <label for="nume">Nume și Prenume</label>
                    <input type="text" id="nume" name="nume" required>
                </div>
                
                <div class="form-group">
                    <label for="telefon">Număr de Telefon</label>
                    <input type="tel" id="telefon" name="telefon" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Adresă de Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="serviciu">Serviciu Dorit</label>
                    <select id="serviciu" name="serviciu" required>
                        <option value="">Selectează un serviciu</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="data">Data Preferată</label>
                    <input type="date" id="data" name="data" required>
                </div>
                
                <div class="form-group">
                    <label for="ora">Ora Preferată</label>
                    <select id="ora" name="ora" required>
                        <option value="">Selectează o oră</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="mesaj">Mesaj Adițional (opțional)</label>
                    <textarea id="mesaj" name="mesaj" placeholder="Dacă ai cerințe speciale sau preferințe, scrie aici..."></textarea>
                </div>
                
                <button type="submit" class="submit-button">Trimite Programarea</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo"></div>
            
            <div class="footer-info">
                <!-- Populat din content.json -->
            </div>
            
            <div class="social-icons">
                <!-- Populat din content.json -->
            </div>
            
            <div class="copyright">
                
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
    <script src="fpc.js"></script>
    
</body>
</html>
